<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click to Survive — Teacher Login</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="card">
  <div class="brand">Click to <em>Survive</em></div>
  <div class="tag">Teacher Dashboard</div>

  <div class="panel active" id="panel-login">
    <label for="login-id">Username or Email</label>
    <input id="login-id" type="text" placeholder="msantos" autocomplete="username">
    <label for="login-pass">Password</label>
    <div class="pw-wrap">
      <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="pw-toggle" aria-label="Show password" onclick="togglePasswordVisibility('login-pass',this)">👁</button>
    </div>
    <button class="btn" id="login-btn" onclick="doTeacherLogin()">Log In</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div class="foot">Accounts are created by your Super Admin — ask them for your username and password if you don't have one. · <a href="index.html">Student Login →</a> · <a href="superadmin-login.html">Super Admin →</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/session.js"></script>
<script src="js/teacher-login.js"></script>
</body>
</html>
