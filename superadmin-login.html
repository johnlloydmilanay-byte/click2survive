<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click to Survive — Super Admin</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="card">
  <div class="brand">Click to <em>Survive</em></div>
  <div class="tag">Super Admin</div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Log In</div>
    <div class="tab" id="tab-setup" onclick="switchTab('setup')">First-Time Setup</div>
  </div>

  <div class="panel active" id="panel-login">
    <label for="login-id">Username or Email</label>
    <input id="login-id" type="text" placeholder="superadmin" autocomplete="username">
    <label for="login-pass">Password</label>
    <div class="pw-wrap">
      <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="pw-toggle" aria-label="Show password" onclick="togglePasswordVisibility('login-pass',this)">👁</button>
    </div>
    <button class="btn" id="login-btn" onclick="doSuperAdminLogin()">Log In</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div class="panel" id="panel-setup">
    <div class="msg" id="setup-status" style="margin-bottom:.6rem">Checking whether a super admin already exists…</div>
    <div id="setup-form" style="display:none">
      <label for="setup-name">Full Name</label>
      <input id="setup-name" type="text" placeholder="Your name">
      <label for="setup-user">Username</label>
      <input id="setup-user" type="text" placeholder="superadmin">
      <label for="setup-pass">Password</label>
      <div class="pw-wrap">
        <input id="setup-pass" type="password" placeholder="At least 6 characters">
        <button type="button" class="pw-toggle" aria-label="Show password" onclick="togglePasswordVisibility('setup-pass',this)">👁</button>
      </div>
      <button class="btn" id="setup-btn" onclick="doSuperAdminSetup()">Create Super Admin Account</button>
      <div class="msg" id="setup-msg"></div>
    </div>
  </div>

  <div class="foot"><a href="teacher-login.html">Teacher Login →</a> · <a href="index.html">Student Login →</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/session.js"></script>
<script src="js/superadmin-login.js"></script>
</body>
</html>
